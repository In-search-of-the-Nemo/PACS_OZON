name: CI smoke (build + up)

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: ubuntu-24.04
          - os: macos-15
            name: macos (arm64)

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FORCE_COLOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: serviz/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OS deps (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install jq + coreutils (macOS)
        if: runner.os == 'macOS'
        run: brew install jq coreutils || true

      # venv + pip install + npm ci + сборка фронта
      - name: Init
        run: make init PYTHON=python3

      # honcho поднимает serviz_backend + serviz_frontend + transnet;
      # даём поработать и обрываем по timeout (код 124 — норма).
      - name: Up smoke test
        shell: bash
        run: |
          set -o pipefail
          TIMEOUT=timeout
          command -v gtimeout >/dev/null && TIMEOUT=gtimeout
          $TIMEOUT 45s make up 2>&1 | tee up.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then
            echo "make up failed with code=${code}"
            exit "${code}"
          fi
          if grep -E -i -n "(traceback|modulenotfound|address already in use|no such file)" up.log; then
            echo "Detected error patterns in logs"
            exit 1
          fi

      # Поднимаем стек в фоне и проверяем, что сообщения из examples/send_status.py
      # доходят до фронта: тест подключается к backend тем же Socket.IO, что и браузер,
      # и ждёт события 'status' и 'update_telemetry', которые слушают компоненты.
      - name: E2E test (example -> frontend)
        shell: bash
        run: |
          . venv/bin/activate
          pip install -q -r requirements-dev.txt
          honcho start > e2e.log 2>&1 &
          HONCHO_PID=$!
          trap 'kill $HONCHO_PID 2>/dev/null || true' EXIT
          python .github/scripts/check_example_delivery.py

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            up.log
            e2e.log
          if-no-files-found: ignore
